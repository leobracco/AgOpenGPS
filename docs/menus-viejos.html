<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgOpenGPS 6.8.5 · Menús viejos reales</title>
<style>
 :root{--bg:#F5F7F4;--surf:#FFF;--surf2:#FBFCFB;--bd:#D9E0D9;--bd2:#C5CFC5;--tx:#101612;--tx2:#535E54;--tx3:#8A948B;--acc:#4ABA3E}
 @media(prefers-color-scheme:dark){:root{--bg:#0E120E;--surf:#161C16;--surf2:#121712;--bd:#28312A;--bd2:#333E35;--tx:#E7ECE6;--tx2:#A7B2A8;--tx3:#6E7A70}}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;font-size:14px;line-height:1.45}
 header{position:sticky;top:0;z-index:10;background:var(--surf);border-bottom:1px solid var(--bd);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
 h1{font-size:15px;margin:0;font-weight:800}.ap{color:var(--acc);font-weight:900}
 .sub{color:var(--tx2);font-size:12px}
 header input{margin-left:auto;padding:7px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--surf2);color:var(--tx);width:220px}
 main{padding:20px;max-width:1200px;margin:0 auto}
 h2{font-size:14px;font-weight:800;margin:28px 0 4px;display:flex;align-items:center;gap:9px}
 h2 .ico{width:26px;height:26px}
 .hint{color:var(--tx3);font-size:12px;margin:0 0 10px}
 /* dropdown menu look */
 .menu{background:var(--surf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;max-width:640px;box-shadow:0 6px 20px -8px rgba(0,0,0,.18)}
 .mi{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--bd);cursor:default}
 .mi:last-child{border-bottom:0}
 .mi:hover{background:var(--surf2)}
 .mi .ic{width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center}
 .mi .ic img{max-width:26px;max-height:26px}
 .mi .ic.no{color:var(--tx3)}
 .mi .t{flex:1;min-width:0}
 .mi .lbl{font-weight:700;font-size:13.5px}
 .mi .fn{color:var(--tx2);font-size:12px}
 .mi .arrow{color:var(--tx3);font-size:15px}
 .sub{background:var(--surf2);border-top:1px dashed var(--bd)}
 .sub .mi{padding-left:34px;border-bottom:1px dashed var(--bd)}
 .sub .mi .lbl{font-weight:600}
 /* toolbar zones */
 .zone{margin:8px 0 18px}
 .zone .zt{font-size:12px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
 .btns{display:flex;flex-wrap:wrap;gap:10px}
 .tbtn{width:150px;background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:9px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
 .tbtn:hover{border-color:var(--bd2)}
 .tbtn .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
 .tbtn .ic img{max-width:38px;max-height:38px}
 .tbtn .ic.no{color:var(--tx3);font-size:18px;font-weight:800}
 .tbtn .lbl{font-weight:700;font-size:12px}
 .tbtn .fn{color:var(--tx2);font-size:11px;line-height:1.3}
 .hidden{display:none!important}
 footer{color:var(--tx3);font-size:11px;text-align:center;padding:24px}
</style></head><body>

<script>
function ic(name,cls){const s=(window.ICONS||{})[name];return s?'<img src="'+s+'">':'<span class="no '+(cls||'')+'">◻</span>';}
function mi(it){
 let sub='';
 if(it.sub&&it.sub.length){sub='<div class="sub">'+it.sub.map(mi).join('')+'</div>';}
 return '<div class="mi" data-txt="'+((it.label+' '+it.fn).toLowerCase())+'">'+
   '<div class="ic'+(((window.ICONS||{})[it.icon])?'':' no')+'">'+ic(it.icon)+'</div>'+
   '<div class="t"><div class="lbl">'+it.label+'</div><div class="fn">'+it.fn+'</div></div>'+
   (it.sub&&it.sub.length?'<div class="arrow">▸</div>':'')+'</div>'+sub;
}
function tbtn(it){
 return '<div class="tbtn" data-txt="'+((it.label+' '+it.fn).toLowerCase())+'">'+
   '<div class="ic'+(((window.ICONS||{})[it.icon])?'':' no')+'">'+ic(it.icon)+'</div>'+
   '<div class="lbl">'+it.label+'</div><div class="fn">'+it.fn+'</div></div>';
}
const main=document.getElementById('main');
// dropdowns
MENUS.forEach(m=>{
 const el=document.createElement('section');
 el.innerHTML='<h2><span class="ic"></span>'+m.name+' <span style="font-weight:600;color:var(--tx3);font-size:12px">('+m.items.length+' ítems)</span></h2>'+
   '<p class="hint">Dropdown de la barra · icono '+m.icon+'</p><div class="menu">'+m.items.map(mi).join('')+'</div>';
 el.querySelector('h2 .ic').innerHTML=ic(m.icon);el.querySelector('h2 .ic').className='ico';
 main.appendChild(el);
});
// toolbar
const tb=document.createElement('section');
tb.innerHTML='<h2>Botones directos de la barra <span style="font-weight:600;color:var(--tx3);font-size:12px">(sin menú)</span></h2><p class="hint">Los botones que están siempre visibles en la pantalla, agrupados por zona.</p>';
TOOLBAR.forEach(z=>{
 const zd=document.createElement('div');zd.className='zone';
 zd.innerHTML='<div class="zt">'+z.zona+'</div><div class="btns">'+z.items.map(tbtn).join('')+'</div>';
 tb.appendChild(zd);
});
main.appendChild(tb);
document.getElementById('ts').textContent=new Date().toLocaleDateString('es-AR');
document.getElementById('q').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase().trim();
 document.querySelectorAll('.mi,.tbtn').forEach(n=>n.classList.toggle('hidden',q&&n.dataset.txt.indexOf(q)<0));
});
</script></body></html>
