<!doctype html>
<html lang="es" class="widget-mode">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menú · PilotX</title>
  <style>
    /* Copia HTML del menú IZQUIERDO nativo (panelLeft) como widget flotante.
       Columna principal con los íconos nativos; al tocar un ítem con submenú
       la ventana se expande a la derecha y muestra sus opciones en HTML
       (resize vía postMessage al host). El menú nativo sigue intacto. */
    /* Misma paleta clara que barra-superior.html (mockup principal.png).
       Sin padding ni border-radius en el body: la superficie llena la
       ventana del widget y las esquinas las recorta el DWM de Win11. */
    :root {
      --green: #4ABA3E;
      --green-dark: #2A8F31;
      --green-soft: #EAF6E7;
      --ink: #101612;
      --muted: #6F786F;
      --line: #D9E0D9;
      --line-strong: #C8D1C8;
      --surface: #FFFFFF;
      --surface-soft: #F7F9F7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--surface);
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 8px;
      overflow: hidden;
    }
    .wrap { display: flex; gap: 8px; height: 100%; }

    .col {
      display: flex; flex-direction: column; gap: 5px;
      width: 78px; flex: 0 0 78px; height: 100%;
    }
    .mbtn {
      flex: 1 1 0;
      min-height: 50px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 3px 2px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); color: var(--ink);
      font: 600 9.5px/1.05 "Segoe UI", sans-serif;
      text-align: center; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }
    .mbtn img { width: 28px; height: 28px; object-fit: contain; }
    .mbtn:hover { background: var(--surface-soft); border-color: var(--line-strong); }
    .mbtn:active { background: var(--green-soft); transform: translateY(1px); }
    .mbtn.on {
      border-color: var(--green); background: var(--green-soft);
      box-shadow: inset 0 -3px 0 var(--green);
    }
    .mbtn.flash { border-color: var(--green); box-shadow: 0 0 0 2px rgba(74,186,62,0.35); }

    /* submenú (columna derecha) */
    .sub {
      flex: 1 1 auto; min-width: 0; height: 100%;
      background: var(--surface-soft);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
      overflow: hidden;
    }
    .sub[hidden] { display: none; }
    .sub h3 {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--muted); padding: 0 2px;
      flex: 0 0 auto;
    }
    .sub .items {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-content: start;
    }
    .sbtn {
      min-height: 54px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 4px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); color: var(--ink);
      font: 600 10.5px/1.1 "Segoe UI", sans-serif;
      text-align: center; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }
    .sbtn .ico { font-size: 17px; line-height: 1; }
    .sbtn:hover { background: var(--surface-soft); border-color: var(--line-strong); }
    .sbtn:active { background: var(--green-soft); transform: translateY(1px); }
    .sbtn.flash { border-color: var(--green); box-shadow: 0 0 0 2px rgba(74,186,62,0.35); }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- columna principal: mismo orden e íconos que el panelLeft nativo.
         data-cmd = acción directa; data-sub = abre submenú HTML -->
    <div class="col" id="mainCol">
      <button type="button" class="mbtn" data-sub="navegacion">
        <img src="../img/menu/NavigationSettings.png" alt=""><span>Navegación</span>
      </button>
      <button type="button" class="mbtn" data-sub="config">
        <img src="../img/menu/Settings48.png" alt=""><span>Config</span>
      </button>
      <button type="button" class="mbtn" data-sub="herramientas">
        <img src="../img/menu/SpecialFunctions.png" alt=""><span>Herramientas</span>
      </button>
      <button type="button" class="mbtn" data-sub="lote">
        <img src="../img/menu/JobActive.png" alt=""><span>Lote</span>
      </button>
      <button type="button" class="mbtn" data-sub="herrlote">
        <img src="../img/menu/FieldTools.png" alt=""><span>Herr. lote</span>
      </button>
      <button type="button" class="mbtn" data-cmd="direccion">
        <img src="../img/menu/AutoSteerConf.png" alt=""><span>Dirección</span>
      </button>
      <button type="button" class="mbtn" data-cmd="corex">
        <img src="../img/menu/CoreX.png" alt=""><span>CoreX</span>
      </button>
    </div>

    <!-- submenú: lo llena el JS según el ítem tocado -->
    <div class="sub" id="subPanel" hidden>
      <h3 id="subTitle"></h3>
      <div class="items" id="subItems"></div>
    </div>
  </div>
  <script src="../js/menu-izquierda.js?v=4"></script>
</body>
</html>
