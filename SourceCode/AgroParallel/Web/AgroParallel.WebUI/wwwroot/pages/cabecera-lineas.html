<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabecera por líneas</title>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="../keyboard.css" />
  <style>
    /* ============================================================================
       Widget CABECERA POR LÍNEAS — reemplazo de FormHeadAche. Canvas interactivo
       a la izquierda (tap = marcar A/B sobre el contorno, drag = pan, rueda/pinch
       = zoom) y columna de controles a la derecha. La geometría corre en C#:
       /api/cabecera-lineas/*. Flujo: 1) distancia, 2) tocar A y B → línea,
       3) repetir hasta cerrar el anillo, 4) Construir.
       ============================================================================ */
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--agp-bg); color: var(--agp-text);
    }
    body {
      font-family: var(--agp-font-sans);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .hl-head {
      display: flex; align-items: center; gap: 8px;
      padding: clamp(3px, 1vh, 6px) 10px;
      background: var(--agp-surface);
      border-bottom: 1px solid var(--agp-border);
      flex-shrink: 0;
    }
    .hl-head .title { font-weight: var(--agp-fw-bold); font-size: 13px; flex: 1; }
    .hl-head .hint { font-size: 11px; color: var(--agp-text-muted); }

    .hl-body {
      flex: 1; min-height: 0;
      display: flex; gap: clamp(4px, 0.8vw, 8px);
      padding: clamp(4px, 1vh, 8px);
    }

    .hl-map {
      flex: 1 1 auto; min-width: 0;
      background: var(--agp-surface);
      border: 1px solid var(--agp-border);
      border-radius: var(--agp-radius-sm);
      position: relative; overflow: hidden;
    }
    #cvMap { width: 100%; height: 100%; display: block; touch-action: none; }

    .hl-warn {
      position: absolute; left: 8px; right: 8px; top: 8px;
      display: none; background: #5a2c2c; color: #fff;
      border-radius: var(--agp-radius-sm);
      padding: 6px 8px; font-size: clamp(10px, 2vh, 12px);
      pointer-events: none;
    }
    .hl-warn.show { display: block; }

    .hl-side {
      flex: 0 0 clamp(180px, 24vw, 230px);
      display: flex; flex-direction: column; gap: clamp(3px, 0.8vh, 6px);
      overflow-y: auto;
    }

    .btn {
      min-height: clamp(26px, 6.2vh, 40px);
      font-family: var(--agp-font-sans); font-size: clamp(11px, 2.2vh, 13px);
      background: var(--agp-surface); color: var(--agp-text);
      border: 1px solid var(--agp-border);
      border-radius: var(--agp-radius-sm);
      cursor: pointer; padding: 2px 6px;
    }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .hl-accent { background: var(--agp-accent); color: #fff; border-color: var(--agp-accent); }
    .hl-danger { background: #5a2c2c; color: #fff; border-color: #5a2c2c; }

    .hl-row { display: flex; gap: clamp(3px, 0.6vw, 6px); }
    .hl-row .btn { flex: 1 1 0; }
    .hl-label { font-size: clamp(10px, 2vh, 12px); color: var(--agp-text-muted); }

    .hl-seg { display: flex; border: 1px solid var(--agp-border); border-radius: var(--agp-radius-sm); overflow: hidden; }
    .hl-seg .btn { flex: 1 1 0; border: 0; border-radius: 0; }
    .hl-seg .btn.on { background: var(--agp-accent); color: #fff; }

    .hl-dist { display: flex; align-items: center; gap: 6px; }
    .hl-dist input {
      flex: 1 1 auto; min-width: 0; min-height: clamp(26px, 6.2vh, 40px);
      font-family: var(--agp-font-mono); font-size: clamp(12px, 2.4vh, 14px);
      background: var(--agp-bg); color: var(--agp-text);
      border: 1px solid var(--agp-border); border-radius: var(--agp-radius-sm);
      text-align: center; padding: 0 6px;
    }

    .hl-sel {
      font-family: var(--agp-font-mono); font-size: clamp(10px, 2vh, 12px);
      color: var(--agp-text-muted); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .hl-check { display: flex; align-items: center; gap: 6px; font-size: clamp(10px, 2vh, 12px); }
    .hl-check input { width: 18px; height: 18px; }

    .hl-sep { border-top: 1px solid var(--agp-border); margin: 2px 0; }
  </style>
</head>
<body>
  <div class="hl-head">
    <span class="title">Cabecera por líneas</span>
    <span class="hint">1· distancia · 2· tocá A y B en el contorno · 3· Construir</span>
  </div>

  <div class="hl-body">
    <div class="hl-map">
      <canvas id="cvMap"></canvas>
      <div id="warnBox" class="hl-warn"></div>
    </div>

    <div class="hl-side">
      <div class="hl-label">Tipo de línea</div>
      <div class="hl-seg">
        <button class="btn on" id="segCurve">Curva</button>
        <button class="btn" id="segLine">Recta</button>
      </div>

      <div class="hl-label">Distancia hacia adentro (<span id="unitLabel">m</span>)</div>
      <div class="hl-dist">
        <input id="inpDist" type="text" inputmode="decimal" value="0" />
        <button class="btn" id="btnWidthX" title="Múltiplo del ancho del implemento">× ancho</button>
      </div>
      <div class="hl-label" id="lblTool">Implemento: — </div>

      <div class="hl-sep"></div>

      <div class="hl-sel" id="selInfo">Sin línea seleccionada</div>
      <div class="hl-row">
        <button class="btn" id="btnPrev">◀</button>
        <button class="btn" id="btnNext">▶</button>
        <button class="btn hl-danger" id="btnDelTrack">🗑</button>
      </div>
      <div class="hl-row">
        <button class="btn" id="btnAPlus">A +</button>
        <button class="btn" id="btnAMinus">A −</button>
        <button class="btn" id="btnBPlus">B +</button>
        <button class="btn" id="btnBMinus">B −</button>
      </div>
      <button class="btn" id="btnCancelTouch">Descartar toque</button>

      <div class="hl-sep"></div>

      <button class="btn hl-accent" id="btnBuild">⚙ Construir cabecera</button>
      <button class="btn" id="btnReset">Reiniciar</button>
      <label class="hl-check"><input type="checkbox" id="chkSection" /> Secciones controladas</label>

      <div style="margin-top:auto;"></div>
      <button class="btn hl-danger" id="btnOff">Apagar cabecera</button>
      <button class="btn" id="btnExit">Salir</button>
    </div>
  </div>

  <script src="../js/keyboard.js"></script>
  <script src="../js/cabecera-lineas.js"></script>
</body>
</html>
