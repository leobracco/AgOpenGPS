<!doctype html>
<html lang="es" class="widget-mode">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barra abajo · PilotX</title>
  <style>
    /* Copia HTML de la barra inferior nativa (panelBottom, FlowLayout
       RightToLeft): elegir guía, centrar, mover guía, bandera, cabecera,
       secciones por cabecera, hidráulico, tramlines, reset herramienta,
       color de mapeo, skips de U-turn — mismo orden, mismos íconos y mismas
       reglas de visibilidad que el panel nativo (GUI.Designer.cs).
       La barra nativa sigue intacta; esto es un espejo. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #F5F7F4;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 4px;
      overflow: hidden;
    }
    /* row-reverse = FlowDirection RightToLeft del nativo: el primer botón
       del markup (elegir guía) queda a la derecha, como en la WinForm. */
    .bar {
      display: flex; flex-direction: row-reverse;
      align-items: stretch; gap: 4px; height: 100%;
      justify-content: flex-start;
    }
    /* Los botones crecen para repartirse el ancho de la barra (espejo de
       PanelSizeRightAndBottom en el nativo, tope 150px como el sizer) y el
       ícono escala con el botón. Achicar la barra achica los íconos. */
    .rbtn {
      flex: 1 1 0; min-width: 34px; max-width: 150px;
      display: flex; align-items: center; justify-content: center;
      padding: 4px;
      border: 1px solid #C5CFC5; border-radius: 10px;
      background: #E2E7E2; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }
    .rbtn img {
      width: 100%; height: 100%;
      max-width: 54px; max-height: 54px;
      object-fit: contain; pointer-events: none;
    }
    .rbtn:active { background: #C5CFC5; transform: translateY(1px); }
    .rbtn.flash { border-color: #4ABA3E; box-shadow: 0 0 0 2px rgba(74,186,62,0.35); }
    .rbtn.disabled { opacity: .45; pointer-events: none; }
    .rbtn.hidden, .skips.hidden { display: none; }

    /* cboxpRowWidth: ancho de salteo del U-turn (1..10) */
    .skips {
      flex: 0 0 auto; align-self: center;
      font: 700 22px/1 "Arial", sans-serif; color: #101612;
      background: #E2E7E2; border: 1px solid #C5CFC5; border-radius: 10px;
      padding: 12px 8px; height: 64px;
      touch-action: manipulation;
    }

    /* sin lote abierto el panel nativo directamente no existe */
    .nolote {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(245,247,244,0.92);
      font: 600 12px/1.4 "Segoe UI", sans-serif; color: #535E54;
      text-align: center; padding: 8px;
    }
    .nolote.hidden { display: none; }
  </style>
</head>
<body>
  <div class="bar">
    <!-- btnTrack: elegir guía (a la derecha de todo, como el nativo) -->
    <button type="button" class="rbtn" id="btnTrack" data-cmd="pick" title="Elegir guía">
      <img src="../img/barra-abajo/TrackOn.png" alt="">
    </button>

    <!-- btnSnapToPivot: centrar guía en el pivote (solo con guía + nudge) -->
    <button type="button" class="rbtn hidden" id="btnCenter" data-cmd="center" title="Centrar guía">
      <img src="../img/barra-abajo/SnapToPivot.png" alt="">
    </button>

    <!-- btnAdjRight: mover guía a la derecha -->
    <button type="button" class="rbtn hidden" id="btnNudgeR" data-cmd="nudge_right" title="Mover guía ›">
      <img src="../img/barra-abajo/SnapRight.png" alt="">
    </button>

    <!-- btnAdjLeft: mover guía a la izquierda -->
    <button type="button" class="rbtn hidden" id="btnNudgeL" data-cmd="nudge_left" title="Mover guía ‹">
      <img src="../img/barra-abajo/SnapLeft.png" alt="">
    </button>

    <!-- btnFlag: colocar bandera (color según flag_color) -->
    <button type="button" class="rbtn" id="btnFlag" data-cmd="bandera" title="Colocar bandera">
      <img id="imgFlag" src="../img/barra-abajo/FlagRed.png" alt="">
    </button>

    <!-- btnHeadlandOnOff: cabecera on/off (solo con cabecera creada) -->
    <button type="button" class="rbtn hidden" id="btnHeadland" data-cmd="cabecera_onoff" title="Cabecera on/off">
      <img id="imgHeadland" src="../img/barra-abajo/HeadlandOff.png" alt="">
    </button>

    <!-- cboxIsSectionControlled: secciones controladas por cabecera -->
    <button type="button" class="rbtn hidden" id="btnHdlSec" data-cmd="cabecera_secciones" title="Secciones por cabecera">
      <img id="imgHdlSec" src="../img/barra-abajo/HeadlandSectionOff.png" alt="">
    </button>

    <!-- btnHydLift: hidráulico en cabecera (requiere módulo + cabecera activa) -->
    <button type="button" class="rbtn hidden" id="btnHyd" data-cmd="hidraulico" title="Hidráulico en cabecera">
      <img id="imgHyd" src="../img/barra-abajo/HydraulicLiftOff.png" alt="">
    </button>

    <!-- btnTramDisplayMode: vista de tramlines (solo con tram creado) -->
    <button type="button" class="rbtn hidden" id="btnTram" data-cmd="tram_vista" title="Vista de tramlines">
      <img id="imgTram" src="../img/barra-abajo/TramOff.png" alt="">
    </button>

    <!-- btnResetToolHeading: alinear implemento detrás del tractor -->
    <button type="button" class="rbtn" id="btnResetTool" data-cmd="reset_herramienta" title="Alinear implemento">
      <img src="../img/barra-abajo/ResetTool.png" alt="">
    </button>

    <!-- btnChangeMappingColor: color de mapeo de secciones -->
    <button type="button" class="rbtn" id="btnMapColor" data-cmd="mapeo_color" title="Color de mapeo">
      <img src="../img/barra-abajo/SectionMapping.png" alt="">
    </button>

    <!-- btnYouSkipEnable: modo de salteo del U-turn (solo con guía) -->
    <button type="button" class="rbtn hidden" id="btnYouSkip" data-cmd="uturn_skips" title="Salteo de U-turn">
      <img id="imgYouSkip" src="../img/barra-abajo/YouSkipOff.png" alt="">
    </button>

    <!-- cboxpRowWidth: ancho de salteo 1..10 (a la izquierda de todo) -->
    <select class="skips hidden" id="selSkips" title="Ancho de salteo">
      <option value="1">1</option><option value="2">2</option>
      <option value="3">3</option><option value="4">4</option>
      <option value="5">5</option><option value="6">6</option>
      <option value="7">7</option><option value="8">8</option>
      <option value="9">9</option><option value="10">10</option>
    </select>
  </div>

  <!-- el panelBottom nativo se oculta sin lote abierto -->
  <div class="nolote" id="noLote">Abrí un lote para operar</div>

  <script src="../js/barra-abajo.js?v=1"></script>
</body>
</html>
