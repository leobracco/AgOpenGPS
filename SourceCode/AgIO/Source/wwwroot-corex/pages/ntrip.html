<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTRIP — CoreX</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/layout.css">
  <link rel="stylesheet" href="/corex.css">
</head>
<body>
  <div class="cx-shell">

    <aside class="cx-sidebar">
      <div class="cx-side-logo"><img src="/img/agro_logo.png" alt="Agro Parallel"></div>
      <div class="cx-mini">CoreX · Agro Parallel</div>
      <a class="cx-side-item" href="/index.html"><span class="cx-ico">🏠</span>Principal</a>
      <a class="cx-side-item" href="/pages/serial.html"><span class="cx-ico">🔌</span>Serial</a>
      <a class="cx-side-item active" href="/pages/ntrip.html"><span class="cx-ico">📍</span>NTRIP</a>
      <a class="cx-side-item" href="/pages/red.html"><span class="cx-ico">🌐</span>Red</a>
      <a class="cx-side-item" href="/pages/modulos.html"><span class="cx-ico">⚙️</span>Módulos</a>
    </aside>

    <div class="cx-content">
      <div class="cx-head">
        <div>
          <h2>NTRIP</h2>
          <p>Caster, credenciales, GGA y destino de las correcciones</p>
        </div>
        <div class="cx-pills">
          <span class="cx-pill"><span id="hdrVersion">—</span></span>
          <span class="cx-pill">perfil&nbsp;<span id="hdrProfile">—</span></span>
        </div>
      </div>

      <div class="cx-grid">

        <!-- Card: Conexión -->
        <section class="cx-panel">
          <h3>Conexión</h3>

          <div class="cx-toggle-row">
            <input type="checkbox" id="is_on">
            <label for="is_on">Habilitar NTRIP</label>
          </div>

          <div class="cx-form one">
            <div class="cx-field">
              <label for="caster_url">URL del caster</label>
              <input class="cx-input" type="text" id="caster_url" placeholder="rtk2go.com">
            </div>

            <div class="cx-field">
              <label for="caster_ip">IP del caster (resuelve desde URL o ingresá manualmente)</label>
              <input class="cx-input" type="text" id="caster_ip" placeholder="0.0.0.0">
            </div>

            <div class="cx-field">
              <label for="caster_port">Puerto del caster</label>
              <input class="cx-input" type="number" id="caster_port" min="1" max="65535" step="1">
            </div>

            <div class="cx-field">
              <label for="mount">Mountpoint</label>
              <input class="cx-input" type="text" id="mount" placeholder="MOUNTPOINT">
            </div>

            <div class="cx-field">
              <label for="user_name">Usuario</label>
              <input class="cx-input" type="text" id="user_name" autocomplete="off">
            </div>

            <div class="cx-field">
              <label for="user_password">Contraseña</label>
              <input class="cx-input" type="password" id="user_password" autocomplete="off">
            </div>
          </div>
        </section>

        <!-- Card: GGA -->
        <section class="cx-panel">
          <h3>GGA</h3>

          <div class="cx-form one">
            <div class="cx-field">
              <label for="send_gga_interval">Intervalo de envío GGA (segundos; 0 = no enviar)</label>
              <input class="cx-input" type="number" id="send_gga_interval" min="0" max="300" step="1">
            </div>

            <div class="cx-field">
              <label for="is_gga_manual">Fuente de posición GGA</label>
              <select id="is_gga_manual">
                <option value="gps">Usar posición GPS</option>
                <option value="manual">Usar posición manual</option>
              </select>
            </div>

            <div class="cx-field">
              <label for="manual_lat">Latitud manual</label>
              <input class="cx-input" type="number" id="manual_lat" step="0.000001" min="-90" max="90">
            </div>

            <div class="cx-field">
              <label for="manual_lon">Longitud manual</label>
              <input class="cx-input" type="number" id="manual_lon" step="0.000001" min="-180" max="180">
            </div>
          </div>
        </section>

        <!-- Card: Avanzado -->
        <section class="cx-panel">
          <h3>Avanzado</h3>

          <div class="cx-toggle-row">
            <input type="checkbox" id="is_tcp">
            <label for="is_tcp">Usar TCP (en vez de NTRIP/HTTP)</label>
          </div>

          <div class="cx-form one">
            <div class="cx-field">
              <label for="http_ver">Versión HTTP</label>
              <select id="http_ver">
                <option value="1.0">1.0</option>
                <option value="1.1">1.1</option>
              </select>
            </div>

            <div class="cx-field">
              <label for="packet_size">Tamaño de paquete</label>
              <select id="packet_size">
                <option value="256">256</option>
                <option value="512">512</option>
                <option value="1024">1024</option>
              </select>
            </div>

            <div class="cx-field">
              <label>Destino de las correcciones</label>
              <div class="cx-toggle-row">
                <input type="radio" name="dest" id="dest_serial" value="serial">
                <label for="dest_serial">Puerto serie</label>
              </div>
              <div class="cx-toggle-row">
                <input type="radio" name="dest" id="dest_udp" value="udp">
                <label for="dest_udp">UDP</label>
              </div>
            </div>

            <div class="cx-field">
              <label for="send_to_udp_port">Puerto UDP de destino</label>
              <input class="cx-input" type="number" id="send_to_udp_port" min="1" max="65535" step="1">
            </div>
          </div>

          <p class="cx-hint">
            Cambiar "Habilitar NTRIP" o el destino (serie/UDP) requiere reiniciar CoreX.
            Los demás cambios se aplican en caliente.
          </p>
        </section>

      </div>

      <!-- Área de guardado unificada -->
      <div class="cx-actions">
        <button class="cx-btn green wide" id="btn-save">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/js/modal.js"></script>
  <script src="/js/hdr.js"></script>
  <script src="/js/ntrip.js"></script>
</body>
</html>
